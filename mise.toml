[tools]
stylua = "latest"

[tasks."lint"]
description = "Lint all lua files"
run = "stylua --check -a ."

[tasks."format"]
description = "Format all lua files"
run = "stylua -a ."

[tasks."generate-extras"]
description = "Generate extra files using current neovim config"
run = "nvim --headless -c 'luafile generate_extras.lua' -c 'qa!'"

[tasks."copy-extras"]
run = '''
#!/usr/bin/env bash
set -x
cp ./extras/dark/isocon-dark.ghostty ~/.config/ghostty/themes/isocon-dark
cp ./extras/light/isocon-light.ghostty ~/.config/ghostty/themes/isocon-light

# Fish auto-sources everything in conf.d, so keep both themes in a subdir it
# won't source and use a small dispatcher to pick one by macOS appearance.
mkdir -p ~/.config/fish/themes
cp ./extras/dark/isocon-dark.fish ~/.config/fish/themes/isocon-dark.fish
cp ./extras/light/isocon-light.fish ~/.config/fish/themes/isocon-light.fish

cat >~/.config/fish/conf.d/fish_frozen_theme.fish <<'EOF'
# Source the isocon theme matching the current macOS appearance, and point
# lazygit at the matching theme file layered on top of the user's own config.
if defaults read -g AppleInterfaceStyle 2>/dev/null | string match -q Dark
    source ~/.config/fish/themes/isocon-dark.fish
    set -gx LG_CONFIG_FILE $HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/isocon-dark.yml
else
    source ~/.config/fish/themes/isocon-light.fish
    set -gx LG_CONFIG_FILE $HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/isocon-light.yml
end
EOF

cp ./extras/dark/isocon-dark.tmux ~/.config/tmux/isocon-dark.tmux
cp ./extras/light/isocon-light.tmux ~/.config/tmux/isocon-light.tmux

# lazygit: install both theme files as their own files (never overwrite the
# user's config.yml). LG_CONFIG_FILE (set in the fish dispatcher above) layers
# the appearance-matched theme on top of config.yml — later files win.
mkdir -p ~/.config/lazygit
cp ./extras/dark/isocon-dark.lazygit.yml ~/.config/lazygit/isocon-dark.yml
cp ./extras/light/isocon-light.lazygit.yml ~/.config/lazygit/isocon-light.yml

# yazi: install both flavors. yazi picks dark/light automatically with the
# terminal via the [flavor] block in theme.toml, so nothing here depends on the
# current appearance.
mkdir -p ~/.config/yazi/flavors
rm -rf ~/.config/yazi/flavors/isocon-dark.yazi ~/.config/yazi/flavors/isocon-light.yazi
cp -R ./extras/dark/isocon-dark.yazi ~/.config/yazi/flavors/isocon-dark.yazi
cp -R ./extras/light/isocon-light.yazi ~/.config/yazi/flavors/isocon-light.yazi

# Only create theme.toml with the [flavor] reference if the user doesn't have
# one — never clobber their existing theme. If it exists, print the block to add.
flavor_block=$'[flavor]\ndark  = "isocon-dark"\nlight = "isocon-light"'
if [ ! -e ~/.config/yazi/theme.toml ]; then
    printf '%s\n' "$flavor_block" >~/.config/yazi/theme.toml
    echo "Created ~/.config/yazi/theme.toml referencing the isocon flavors."
elif ! grep -q '\[flavor\]' ~/.config/yazi/theme.toml; then
    echo "NOTE: ~/.config/yazi/theme.toml already exists. Add this to use isocon:"
    printf '%s\n' "$flavor_block"
fi
'''
